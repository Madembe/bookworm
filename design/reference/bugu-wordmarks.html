<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Bugu – wordmark options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet"/>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e6e6e5;font-family:'Inter',system-ui,sans-serif;color:#222;padding:24px 18px}
h1{font-size:14px;font-weight:600;color:#6b6b6b;margin-bottom:18px;letter-spacing:.02em}
.g{display:grid;gap:14px;max-width:560px;margin:0 auto}
.c{border-radius:14px;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.l{background:#efefee;color:#222;border:1px solid #cfcfcd}
.d{background:#171717;color:#d6d6d4}
.n{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.w{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:-.03em;line-height:1}
.m{border:2.5px solid currentColor;border-radius:2px;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.s1{font-size:44px}.s1 .m{width:26px;height:34px}
.s2{font-size:44px}.s2 .m{width:26px;height:34px}
.s3{font-size:56px;letter-spacing:-.045em}
.sm{font-size:20px}.sm .m{width:13px;height:17px;border-width:2px}
.row{display:flex;gap:22px;align-items:center}
.ic{width:56px;height:56px;border-radius:13px;display:grid;place-items:center;font-size:34px;font-weight:600;letter-spacing:-.04em;background:#222;color:#e6e6e5}
.ic.w2{background:#efefee;color:#222;border:1px solid #cfcfcd}
</style></head><body>
<div class="g">
<h1>BUGU · WORDMARK OPTIONS</h1>
<div class="c l"><span class="n">A · Capitalised with mark</span><div class="w s1"><span class="m"></span>Bugu</div></div>
<div class="c l"><span class="n">B · Lowercase with mark</span><div class="w s2"><span class="m"></span>bugu</div></div>
<div class="c l"><span class="n">C · Lowercase, wordmark only</span><div class="w s3">bugu</div></div>
<div class="c d"><span class="n">B in dark mode</span><div class="w s2"><span class="m"></span>bugu</div></div>
<div class="c l"><span class="n">B small, as in the app header · and app icons</span>
<div class="row"><div class="w sm"><span class="m"></span>bugu</div><div class="ic">b</div><div class="ic w2">b</div></div></div>
</div></body></html>
