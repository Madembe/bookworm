<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BookWorm System Status</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--black:#0a0a0a;--white:#f8f7f4;--gray-100:#f0efec;--gray-200:#e0deda;--gray-300:#c8c5bf;--gray-400:#9a9690;--gray-500:#6b6660;--success:#2d6a4f;--error:#c1121f;--warning:#e76f51;--info:#1a6fa8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--gray-100);color:var(--black);min-height:100vh;}
.header{background:var(--black);color:white;padding:32px 24px;text-align:center;}
.header img{height:48px;margin-bottom:12px;filter:invert(1);}
.header h1{font-size:24px;font-weight:900;margin-bottom:6px;}
.header p{font-size:13px;color:var(--gray-400);}
.overall-banner{padding:16px 24px;text-align:center;font-weight:800;font-size:15px;}
.overall-banner.all-good{background:#d8f3dc;color:#2d6a4f;}
.overall-banner.has-issues{background:#fff3e0;color:#e76f51;}
.overall-banner.has-outages{background:#fee2e2;color:#c1121f;}
.container{max-width:800px;margin:0 auto;padding:24px 16px;}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.sum-card{background:white;border-radius:12px;padding:16px;text-align:center;border:1px solid var(--gray-200);}
.sum-card .num{font-size:28px;font-weight:900;}
.sum-card .lbl{font-size:11px;font-weight:800;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}
.sum-card.green .num{color:var(--success);}
.sum-card.orange .num{color:var(--warning);}
.sum-card.red .num{color:var(--error);}
.category-section{margin-bottom:20px;}
.category-title{font-size:12px;font-weight:900;color:var(--gray-500);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--gray-200);}
.feature-row{background:white;border-radius:10px;padding:14px 18px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--gray-200);gap:12px;}
.feature-name{font-weight:800;font-size:14px;}
.feature-notes{font-size:11px;color:var(--gray-400);margin-top:2px;}
.status-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0;}
.s-live{background:#d8f3dc;color:#2d6a4f;}
.s-issue{background:#fff3e0;color:#e76f51;}
.s-down{background:#fee2e2;color:#c1121f;}
.s-maintenance{background:#e8f4fd;color:#1a6fa8;}
.s-coming_soon{background:var(--gray-100);color:var(--gray-500);}
.footer{text-align:center;padding:32px 16px;font-size:12px;color:var(--gray-400);}
.last-updated{text-align:center;font-size:12px;color:var(--gray-400);margin-bottom:20px;font-weight:700;}
.loading{text-align:center;padding:60px;color:var(--gray-400);font-size:14px;font-weight:700;}
@media(max-width:500px){.summary-row{grid-template-columns:repeat(2,1fr);}.feature-row{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>

<div class="header">
  <img src="https://res.cloudinary.com/drtdddsxp/image/upload/v1776543075/LOGO_BOOKWORM_fcvfic.png" alt="BookWorm"/>
  <h1>System Status</h1>
  <p>Live status of all BookWorm platform features</p>
</div>

<div id="overallBanner" class="overall-banner all-good">
  ✅ All systems operational
</div>

<div class="container">
  <div class="last-updated" id="lastUpdated">Checking status...</div>
  <div class="summary-row" id="summaryRow"></div>
  <div id="featureList" class="loading">⏳ Loading status...</div>
</div>

<div class="footer">
  BookWorm · Powered by AfricaKai · Status page refreshes every 60 seconds
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,getDocs,orderBy,query}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FC={apiKey:"AIzaSyCx22fQpWPMMPz4Gx16kPkS9tewpS7o1GA",authDomain:"bookworm-b9ba6.firebaseapp.com",projectId:"bookworm-b9ba6",storageBucket:"bookworm-b9ba6.firebasestorage.app",messagingSenderId:"616027780575",appId:"1:616027780575:web:c778c93c9779138e54c06a"};
const app=initializeApp(FC);
const db=getFirestore(app);

const categoryLabels={auth:"🔐 Authentication",payments:"💳 Payments & Escrow",listings:"📚 Listings",delivery:"🚚 Delivery",chat:"💬 Chat & Support",ai:"🤖 AI Features",notifications:"🔔 Notifications",other:"⚙️ Other"};
const statusMeta={live:{label:"✅ Operational",cls:"s-live"},issue:{label:"⚠️ Degraded",cls:"s-issue"},down:{label:"🔴 Outage",cls:"s-down"},maintenance:{label:"🔧 Maintenance",cls:"s-maintenance"},coming_soon:{label:"🔜 Coming Soon",cls:"s-coming_soon"}};

async function loadStatus(){
  try{
    const snap=await getDocs(collection(db,"systemStatus"));
    const features=snap.docs.map(d=>({id:d.id,...d.data()}));

    // Summary
    const live=features.filter(f=>f.status==="live").length;
    const issues=features.filter(f=>f.status==="issue").length;
    const down=features.filter(f=>f.status==="down").length;
    const maint=features.filter(f=>f.status==="maintenance").length;

    // Overall banner
    const banner=document.getElementById("overallBanner");
    if(down>0){banner.className="overall-banner has-outages";banner.textContent=`🔴 ${down} feature${down>1?"s":""} currently down — we're investigating`;}
    else if(issues>0){banner.className="overall-banner has-issues";banner.textContent=`⚠️ ${issues} feature${issues>1?"s":""} experiencing issues`;}
    else{banner.className="overall-banner all-good";banner.textContent="✅ All systems operational";}

    document.getElementById("summaryRow").innerHTML=`
      <div class="sum-card green"><div class="num">${live}</div><div class="lbl">Operational</div></div>
      <div class="sum-card orange"><div class="num">${issues}</div><div class="lbl">Issues</div></div>
      <div class="sum-card red"><div class="num">${down}</div><div class="lbl">Down</div></div>
      <div class="sum-card"><div class="num">${maint}</div><div class="lbl">Maintenance</div></div>`;

    // Group by category
    const cats={};
    features.forEach(f=>{
      const cat=f.category||"other";
      if(!cats[cat])cats[cat]=[];
      cats[cat].push(f);
    });

    const catOrder=["auth","payments","listings","delivery","chat","ai","notifications","other"];
    let html="";
    catOrder.forEach(cat=>{
      if(!cats[cat]||!cats[cat].length)return;
      html+=`<div class="category-section"><div class="category-title">${categoryLabels[cat]||cat}</div>`;
      cats[cat].forEach(f=>{
        const sm=statusMeta[f.status]||statusMeta.live;
        const d=f.updatedAt?.toDate?f.updatedAt.toDate():new Date((f.updatedAt?.seconds||0)*1000);
        html+=`<div class="feature-row">
          <div>
            <div class="feature-name">${f.name}</div>
            ${f.notes?`<div class="feature-notes">${f.notes}</div>`:""}
          </div>
          <span class="status-badge ${sm.cls}">${sm.label}</span>
        </div>`;
      });
      html+="</div>";
    });
    document.getElementById("featureList").innerHTML=html||`<div class="loading">No features configured yet.</div>`;

    const now=new Date();
    document.getElementById("lastUpdated").textContent=`Last checked: ${now.toLocaleDateString("en-ZA")} at ${now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`;
  }catch(e){
    document.getElementById("featureList").innerHTML=`<div class="loading">⚠️ Unable to load status. Please try again.</div>`;
    console.error(e);
  }
}

loadStatus();
setInterval(loadStatus,60000);
</script>
</body>
</html>
